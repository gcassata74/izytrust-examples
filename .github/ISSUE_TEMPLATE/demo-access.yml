name: Request demo access
description: Ask for read access to the IzyTrust chart and images on ghcr.io
title: "Demo access: "
labels: [demo-access]
body:
  - type: markdown
    attributes:
      value: |
        Access is granted to the GitHub account that opens this issue. We reply here
        when the three packages are shared with you. Prefer email? Use the
        [contact form](https://izylifesolutions.com/?service=izytrust-demo#contacts).
  - type: input
    id: company
    attributes:
      label: Company or organisation
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What do you want to try?
      description: For example the MCP servers or systems you want to put behind IzyTrust.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Where will you run it?
      options: [k3d / k3s on a laptop, Existing Kubernetes cluster, Not sure yet]
    validations:
      required: true
