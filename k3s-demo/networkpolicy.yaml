# Upstream MCP servers accept traffic only from IzyTrust pods.
# (k3s enforces NetworkPolicy out of the box.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstreams-only-from-izytrust
  namespace: izytrust
spec:
  podSelector:
    matchLabels: {izytrust/role: upstream}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: izytrust}
      ports:
        - {protocol: TCP, port: 8000}
